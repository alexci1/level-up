<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL UP GAMER</title>
    <link rel="stylesheet" href="../css/style_login.css">
    <link rel="icon" type="image/png" href="../img/level-up.png">
</head>

<body>

    <header>
        <nav class="nav-bar">
            <div class="logo">
                <a href="index.html">LEVEL UP GAMER</a>
            </div>
            <ul class="nav-links">
                <li>
                    <a href="index.html">INICIO</a>
                </li>
                <li>
                    <a href="products.html">PRODUCTOS</a>
                </li>
                <li>
                    <a href="sales.html">OFERTAS</a>
                </li>
                <li>
                    <a href="about.html">NOSOTROS</a>
                </li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="login-link">
                    <ion-icon name="person"></ion-icon>
                    <span>INICIAR SESIÓN</span>
                </a>
                <span class="separator">|</span>
                <a href="cart.html" class="cart-link">
                    <ion-icon name="cart"></ion-icon>
                    <span>CARRITO</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <form id="loginForm" class="auth-card" novalidate>
            <div class="auth-header">
                <img src="../img/level-up.png" alt="Level Up Logo" class="auth-logo">
                <h2>INICIAR SESIÓN</h2>
            </div>

            <div class="form-group">
                <label for="loginEmail">CORREO ELECTRÓNICO</label>
                <input type="email" id="loginEmail" placeholder="ejemplo@duoc.cl" autocomplete="off">
                <small class="error-msg" id="errorLoginEmail"></small>
            </div>

            <div class="form-group">
                <label for="loginPassword">CONTRASEÑA</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
                <small class="error-msg" id="errorLoginPassword"></small>
            </div>

            <small class="error-msg general-error" id="loginGeneralError"></small>

            <button type="submit" class="auth-button">INGRESAR</button>

            <p class="auth-footer">
                ¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a>
            </p>
        </form>
    </main>

    <footer class="footer">
        <ul class="social-icon">
            <li class="icon-elem">
                <a href="" class="icon" target="_blank">
                    <ion-icon name="logo-instagram"></ion-icon>
                </a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon">
                    <ion-icon name="logo-whatsapp"></ion-icon>
                </a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon" target="_blank">
                    <ion-icon name="logo-facebook"></ion-icon>
                </a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon">
                    <ion-icon name="mail-outline"></ion-icon>
                </a>
            </li>
        </ul>
        <ul class="menu">
            <li class="menu-elem">
                <a href="" class="menu-icon">Inicio</a>
            </li>
            <li class="menu-elem">
                <a href="" class="menu-icon">Contacto</a>
            </li>
            <li class="menu-elem">
                <a href="" class="menu-icon">Nosotros</a>
            </li>
        </ul>
        <p class="text">© 2026 | Todos los derechos reservados | Santiago de Chile</p>
    </footer>

    <script src="../js/auth.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>

</html>
