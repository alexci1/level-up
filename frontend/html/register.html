<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO — LEVEL UP GAMER</title>
    <link rel="stylesheet" href="../css/style_register.css">
    <link rel="icon" type="image/png" href="../img/level-up.png">
</head>

<body>

    <header>
        <nav class="nav-bar">
            <div class="logo">
                <a href="index.html">LEVEL UP GAMER</a>
            </div>
            <ul class="nav-links">
                <li>
                    <a href="index.html">INICIO</a>
                </li>
                <li>
                    <a href="products.html">PRODUCTOS</a>
                </li>
                <li>
                    <a href="sales.html">OFERTAS</a>
                </li>
                <li>
                    <a href="about.html">NOSOTROS</a>
                </li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="login-link">
                    <ion-icon name="person"></ion-icon>
                    <span>INICIAR SESIÓN</span>
                </a>
                <span class="separator">|</span>
                <a href="cart.html" class="cart-link">
                    <ion-icon name="cart"></ion-icon>
                    <span>CARRITO</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <form id="registroForm" class="auth-card" novalidate>
            <div class="auth-header">
                <img src="../img/level-up.png" alt="Level Up Logo" class="auth-logo">
                <h2>CREAR CUENTA</h2>
            </div>

            <div class="form-group">
                <label for="regRun">RUN (SIN PUNTOS NI GUIÓN)</label>
                <input type="text" id="regRun" placeholder="Ej: 19011022K" maxlength="9" autocomplete="off">
                <small class="error-msg" id="errorRegRun"></small>
            </div>

            <div class="form-group">
                <label for="regNombre">NOMBRE</label>
                <input type="text" id="regNombre" placeholder="Tu nombre" autocomplete="off">
                <small class="error-msg" id="errorRegNombre"></small>
            </div>

            <div class="form-group">
                <label for="regApellidos">APELLIDOS</label>
                <input type="text" id="regApellidos" placeholder="Tus apellidos" autocomplete="off">
                <small class="error-msg" id="errorRegApellidos"></small>
            </div>

            <div class="form-group">
                <label for="regEmail">CORREO ELECTRÓNICO</label>
                <input type="email" id="regEmail" placeholder="ejemplo@duoc.cl" autocomplete="off">
                <small class="error-msg" id="errorRegEmail"></small>
            </div>

            <div class="form-group">
                <label for="regPassword">CONTRASEÑA</label>
                <input type="password" id="regPassword" placeholder="Entre 4 y 10 caracteres">
                <small class="error-msg" id="errorRegPassword"></small>
            </div>

            <button type="submit" class="auth-button">REGISTRARSE</button>

            <p class="auth-footer">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </form>
    </main>

    <footer class="footer">
        <ul class="social-icon">
            <li class="icon-elem">
                <a href="" class="icon" target="_blank">
                    <ion-icon name="logo-instagram"></ion-icon>
                </a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon">
                    <ion-icon name="logo-whatsapp"></ion-icon>
                </a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon" target="_blank">
                    <ion-icon name="logo-facebook"></ion-icon>
                </a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon">
                    <ion-icon name="mail-outline"></ion-icon>
                </a>
            </li>
        </ul>
        <ul class="menu">
            <li class="menu-elem">
                <a href="index.html" class="menu-icon">Inicio</a>
            </li>
            <li class="menu-elem">
                <a href="contact.html" class="menu-icon">Contacto</a>
            </li>
            <li class="menu-elem">
                <a href="about.html" class="menu-icon">Nosotros</a>
            </li>
        </ul>
        <p class="text">© 2026 | Todos los derechos reservados | Santiago de Chile</p>
    </footer>

    <script src="../js/auth.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>

</html>
