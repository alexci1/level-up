<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL UP GAMER</title>
    <link rel="stylesheet" href="../css/style_product-detail.css">
    <link rel="icon" type="image/png" href="../img/level-up.png">
</head>

<body>

    <header>

        <nav class="nav-bar">
            <div class="logo">
                <a href="index.html">
                    <img src="../img/level-up.png" alt="Logo Level Up Gamer" class="logo-img">
                    <span>LEVEL UP GAMER</span>
                </a>
            </div>

            <ul class="nav-links">
                <li>
                    <a href="index.html" class="active">INICIO</a>
                </li>
                <li>
                    <a href="products.html">PRODUCTOS</a>
                </li>
                <li>
                    <a href="blogs.html">BLOGS</a>
                </li>
                <li>
                    <a href="contacto.html">CONTACTO</a>
                </li>
                <li>
                    <a href="about.html">NOSOTROS</a>
                </li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="login-link">
                    <ion-icon name="person"></ion-icon>
                    <span>INICIAR SESIÓN</span>
                </a>
                <span class="separator">|</span>
                <a href="cart.html" class="cart-link">
                    <ion-icon name="cart"></ion-icon>
                    <span>CARRITO</span>
                </a>
            </div>
        </nav>

    </header>

    <main class="detail-section">

        <div id="detailContainer" class="detail-card">

            <div class="detail-image-container">
                <img id="detailImage" src="" alt="Producto">
            </div>

            <div class="detail-info-container">
                <h1 id="detailTitle"></h1>
                <p id="detailPrice"></p>
                <p id="detailDescription"></p>

                <div class="quantity-group">
                    <label>CANTIDAD:</label>
                    <div class="quantity-controls">
                        <button type="button" class="btn-qty" id="btnMinusDetail">-</button>
                        <span id="detailQuantityText">1</span>
                        <button type="button" class="btn-qty" id="btnPlusDetail">+</button>
                    </div>
                </div>

                <div class="detail-rating-container">
                    <div id="detailStars" class="detail-stars"></div>
                    <span id="detailRatingText" class="detail-rating-text"></span>
                </div>

                <button id="btnAddToCartDetail" class="detail-add-btn">AGREGAR AL CARRITO</button>
            </div>

        </div>

        <div class="reviews-section">
            <h2>RESEÑAS Y VALORACIONES DE JUGADORES</h2>

            <form id="reviewForm" class="review-form">
                <h3>DEJA TU VALORACIÓN</h3>

                <div class="star-rating-selector">
                    <span>CALIFICACIÓN:</span>
                    <div class="stars-input">
                        <ion-icon name="star-outline" data-value="1"></ion-icon>
                        <ion-icon name="star-outline" data-value="2"></ion-icon>
                        <ion-icon name="star-outline" data-value="3"></ion-icon>
                        <ion-icon name="star-outline" data-value="4"></ion-icon>
                        <ion-icon name="star-outline" data-value="5"></ion-icon>
                    </div>
                </div>

                <textarea id="reviewComment" placeholder="Escribe tu opinión sobre el producto..." rows="4"
                    required></textarea>
                <button type="submit" class="btn-submit-review">PUBLICAR RESEÑA</button>
            </form>

            <div id="reviewsContainer" class="reviews-container">
            </div>
        </div>

    </main>

    <footer class="footer">
        <ul class="social-icon">
            <li class="icon-elem">
                <a href="" class="icon" target="_blank">
                    <ion-icon name="logo-instagram"></ion-icon>
                </a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon">
                    <ion-icon name="logo-whatsapp"></ion-icon>
                </a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon" target="_blank">
                    <ion-icon name="logo-facebook"></ion-icon>
                </a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon">
                    <ion-icon name="mail-outline"></ion-icon>
                </a>
            </li>
        </ul>
        <ul class="menu">
            <li class="menu-elem">
                <a href="" class="menu-icon">Inicio</a>
            </li>
            <li class="menu-elem">
                <a href="" class="menu-icon">Contacto</a>
            </li>
            <li class="menu-elem">
                <a href="" class="menu-icon">Nosotros</a>
            </li>
        </ul>
        <p class="text">© 2026 | Todos los derechos reservados | Santiago de Chile</p>
    </footer>

    <script src="../js/product-detail.js"></script>
    <script src="../js/auth.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>

</html>
