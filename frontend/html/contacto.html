<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - LEVEL UP GAMER</title>
    <link rel="stylesheet" href="../css/style_contacto.css">
    <link rel="icon" type="image/png" href="../img/level-up.png">
</head>

<body>

    <header>
        <nav class="nav-bar">
            <div class="logo">
                <a href="index.html">LEVEL UP GAMER</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">INICIO</a></li>
                <li><a href="products.html">PRODUCTOS</a></li>
                <li><a href="sales.html">OFERTAS</a></li>
                <li><a href="blogs.html">BLOGS</a></li>
                <li><a href="contacto.html" class="active">CONTACTO</a></li>
                <li><a href="about.html">NOSOTROS</a></li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="login-link">
                    <ion-icon name="person"></ion-icon>
                    <span>INICIAR SESIÓN</span>
                </a>
                <span class="separator">|</span>
                <a href="cart.html" class="cart-link">
                    <ion-icon name="cart"></ion-icon>
                    <span>CARRITO</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="contacto-section">
        <div class="contacto-card">
            <h2>CONTÁCTANOS</h2>
            <p class="contacto-subtitle">¿TIENES DUDAS O CONSULTAS? DÉJANOS UN MENSAJE</p>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="contactNombre">Nombre Completo</label>
                    <input type="text" id="contactNombre" placeholder="Ej: Juan Pérez">
                    <span id="errorContactNombre" class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="contactEmail">Correo Electrónico</label>
                    <input type="email" id="contactEmail" placeholder="ejemplo@duoc.cl">
                    <span id="errorContactEmail" class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="contactMensaje">Mensaje</label>
                    <textarea id="contactMensaje" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
                    <span id="errorContactMensaje" class="error-msg"></span>
                </div>

                <button type="submit" class="contact-button">ENVIAR MENSAJE</button>
            </form>

            <div id="contactSuccess" class="success-msg"></div>
        </div>
    </main>

    <footer class="footer">
        <ul class="social-icon">
            <li class="icon-elem">
                <a href="" class="icon" target="_blank"><ion-icon name="logo-instagram"></ion-icon></a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon"><ion-icon name="logo-whatsapp"></ion-icon></a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon" target="_blank"><ion-icon name="logo-facebook"></ion-icon></a>
            </li>
            <li class="icon-elem">
                <a href="" class="icon"><ion-icon name="mail-outline"></ion-icon></a>
            </li>
        </ul>
        <ul class="menu">
            <li class="menu-elem"><a href="index.html" class="menu-icon">Inicio</a></li>
            <li class="menu-elem"><a href="blogs.html" class="menu-icon">Blogs</a></li>
            <li class="menu-elem"><a href="contacto.html" class="menu-icon">Contacto</a></li>
            <li class="menu-elem"><a href="about.html" class="menu-icon">Nosotros</a></li>
        </ul>
        <p class="text">© 2026 | Todos los derechos reservados | Santiago de Chile</p>
    </footer>

    <script src="../js/contacto.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>

</html>
